  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #f3e8ff 0%,
          #ffffff 45%,
          #f8fafc 100%
        );

      color: #18181b;

      overflow: hidden;
    }

    .container {
      width: min(90%, 520px);

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;

      padding: 40px 30px;

      border-radius: 28px;

      background: rgba(255, 255, 255, 0.82);

      border: 1px solid rgba(139, 92, 246, 0.12);

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.08);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .logo {
      width: 130px;
      height: 130px;

      object-fit: contain;

      margin-bottom: 22px;

      border-radius: 24px;

      filter:
        drop-shadow(
          0 10px 20px rgba(139, 92, 246, 0.18)
        );
    }

    h1 {
      font-size: 30px;
      font-weight: 800;

      letter-spacing: -0.8px;

      margin-bottom: 10px;
    }

    .description {
      max-width: 390px;

      font-size: 15px;

      line-height: 1.6;

      color: #71717a;

      margin-bottom: 25px;
    }

    .loading {
      width: 38px;
      height: 38px;

      border-radius: 50%;

      border: 4px solid rgba(139, 92, 246, 0.18);

      border-top-color: #8B5CF6;

      animation: spin 0.8s linear infinite;

      margin-bottom: 18px;
    }

    .redirect-text {
      font-size: 13px;

      color: #a1a1aa;
    }

    .button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      margin-top: 20px;

      padding: 12px 22px;

      border-radius: 12px;

      text-decoration: none;

      font-size: 14px;
      font-weight: 700;

      color: white;

      background: #8B5CF6;

      box-shadow:
        0 8px 20px rgba(139, 92, 246, 0.25);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 25px rgba(139, 92, 246, 0.32);
    }

    @keyframes spin {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }

    @media (max-width: 500px) {

      .container {
        padding: 32px 22px;
      }

      .logo {
        width: 105px;
        height: 105px;
      }

      h1 {
        font-size: 26px;
      }

    }

  </style>
