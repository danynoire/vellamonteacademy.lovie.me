  <!-- =========================================================
       ESTILOS
       ========================================================= -->

  <style>

    /*
      Reset
    */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }


    /*
      Página
    */

    html {
      width: 100%;
      height: 100%;
      background: #ffffff;
    }

    body {
      width: 100%;
      min-height: 100vh;
      margin: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at top,
          rgba(139, 92, 246, 0.08),
          transparent 45%
        ),
        #ffffff;

      color: #18181b;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }


    /*
      Container principal
    */

    .page {
      width: 100%;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }


    /*
      Cartão
    */

    .card {
      width: 100%;
      max-width: 460px;

      padding: 42px 32px;

      text-align: center;

      background: rgba(255, 255, 255, 0.96);

      border: 1px solid rgba(139, 92, 246, 0.12);

      border-radius: 24px;

      box-shadow:
        0 20px 60px rgba(24, 24, 27, 0.08);

      animation:
        fadeIn 0.6s ease both;
    }


    /*
      Logo
    */

    .logo {
      display: block;

      width: 112px;
      height: 112px;

      margin: 0 auto 24px;

      object-fit: contain;

      border-radius: 22px;

      animation:
        logoIn 0.7s ease both;
    }


    /*
      Título
    */

    .title {
      margin: 0;

      font-size: 30px;
      line-height: 1.15;

      font-weight: 700;

      letter-spacing: -0.5px;

      color: #18181b;
    }


    /*
      Descrição
    */

    .description {
      max-width: 360px;

      margin: 14px auto 0;

      font-size: 15px;
      line-height: 1.6;

      color: #71717a;
    }


    /*
      Área de carregamento
    */

    .loading {
      margin-top: 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 10px;

      color: #8B5CF6;

      font-size: 14px;
      font-weight: 600;
    }


    /*
      Spinner
    */

    .spinner {
      width: 18px;
      height: 18px;

      border: 2px solid rgba(139, 92, 246, 0.2);

      border-top-color: #8B5CF6;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;
    }


    /*
      Rodapé
    */

    .footer {
      margin-top: 28px;

      font-size: 12px;

      color: #a1a1aa;
    }


    /*
      Link alternativo
    */

    .fallback {
      display: inline-block;

      margin-top: 14px;

      color: #8B5CF6;

      font-size: 13px;
      font-weight: 600;

      text-decoration: none;

      transition:
        opacity 0.2s ease;
    }

    .fallback:hover {
      opacity: 0.75;
      text-decoration: underline;
    }


    /*
      Animações
    */

    @keyframes fadeIn {

      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    @keyframes logoIn {

      from {
        opacity: 0;
        transform: scale(0.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }

    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    /*
      Celular
    */

    @media (max-width: 480px) {

      .page {
        padding: 16px;
      }

      .card {
        padding: 34px 22px;

        border-radius: 20px;
      }

      .logo {
        width: 96px;
        height: 96px;
      }

      .title {
        font-size: 26px;
      }

      .description {
        font-size: 14px;
      }

    }


    /*
      Redução de movimento
    */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }

    }

  </style>


  <!-- =========================================================
       REDIRECIONAMENTO
       ========================================================= -->

  <meta
    http-equiv="refresh"
    content="2;url=https://forwarding.vellamonteacademy.lovie.me"
  >

</head>


<body>

  <!-- =========================================================
       CONTEÚDO
       ========================================================= -->

  <main class="page">

    <section class="card">

      <!-- Logo da Vellamonte Academy -->
      <img
        class="logo"
        src="VellamonteAcademyLogo.png"
        alt="Logo da Vellamonte Academy"
        width="112"
        height="112"
      >


      <!-- Nome -->
      <h1 class="title">
        Vellamonte Academy
      </h1>


      <!-- Descrição -->
      <p class="description">
        Uma experiência escolar completa no Berry Avenue.
        Prepare-se para conhecer a Vellamonte Academy!
      </p>


      <!-- Loading -->
      <div
        class="loading"
        aria-live="polite"
      >

        <span
          class="spinner"
          aria-hidden="true"
        ></span>

        <span>
          Redirecionando...
        </span>

      </div>


      <!-- Link caso o redirecionamento falhe -->
      <a
        class="fallback"
        href="https://forwarding.vellamonteacademy.lovie.me"
      >
        Entrar na Vellamonte Academy
      </a>


      <!-- Rodapé -->
      <div class="footer">
        © Vellamonte Academy
      </div>

    </section>

  </main>


  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->

  <script>

    /*
      Redirecionamento secundário via JavaScript.

      O meta refresh continua existindo como fallback.
      Este script apenas garante que o visitante seja
      encaminhado mesmo em navegadores onde o comportamento
      do meta refresh seja diferente.
    */

    (function () {

      const destination =
        "https://forwarding.vellamonteacademy.lovie.me";

      /*
        Pequeno atraso para permitir que a página
        seja renderizada antes do redirecionamento.
      */

      setTimeout(function () {

        window.location.replace(destination);

      }, 2000);

    })();

  </script>

</body>
